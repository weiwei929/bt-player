[package]
name = "bt-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "bt_player_lib"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
urlencoding = "2.1.3"
async-trait = "0.1"
scraper = "0.22"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

librqbit = { version = "8.1.1", features = ["http-api"] }
librqbit-dualstack-sockets = "0.6"

axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[patch.crates-io]
librqbit = { path = "local-patches/librqbit" }
